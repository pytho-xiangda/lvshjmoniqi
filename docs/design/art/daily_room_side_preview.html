<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>横版日常房间 · 游戏场景预览</title>
<link rel="stylesheet" href="daily_room_preview.css"><link rel="stylesheet" href="daily_room_side_preview.css">
<main>
<header><div><small>律师模拟器 · 横版日常场景 v03</small><h1>午后的房间</h1></div><div class="tools"><button id="replay">播放进门动画</button><button id="computer">走到电脑前</button><button id="door">走到门口</button></div></header>
<div class="stage">
<canvas id="room" width="1672" height="941" aria-label="固定正侧视横版房间；点击地面可移动，电脑桌和房门可交互。"></canvas>
<button class="spot side-desk" id="desk-hotspot" aria-label="到电脑桌办公">办公</button>
<button class="spot side-exit" id="exit-hotspot" aria-label="走到门口外出">外出</button>
<section id="panel" hidden aria-live="polite"><button class="close" id="close" aria-label="返回房间">×</button><small id="panel-kicker"></small><h2 id="panel-title"></h2><p id="panel-desc"></p><div id="options"></div><p class="feedback" id="feedback"></p></section>
</div><footer><span id="status" role="status">正在载入横版房间…</span><span>点击地板可水平移动 · 固定比例 · 无透视缩放</span></footer>
</main><script src="daily_room_side_preview.js"></script>
</html>
